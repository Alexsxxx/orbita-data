# Radio: the internet radio stations the globe can show, placed, to
#   https://alexsxxx.github.io/orbita-data/radio.json.gz
# Generator: tool/build_radio.py in the private Orbita repo - read its
# docstring for what is kept and how a station without coordinates is
# placed.
#
# Weekly: the directory changes slowly. One request to Radio Browser and
# three files from GeoNames; under a minute.
name: radio

on:
  schedule:
    - cron: '30 5 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Orbita (generator lives here)
        uses: actions/checkout@v4
        with:
          repository: Alexsxxx/Orbita
          ssh-key: ${{ secrets.ORBITA_READ_KEY }}
          path: orbita
          sparse-checkout: tool

      - name: Checkout orbita-data (publish target)
        uses: actions/checkout@v4
        with:
          repository: Alexsxxx/orbita-data
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages-repo

      # Exits non-zero without writing when the directory fails or answers
      # short, so nothing bad is ever published.
      - name: Build radio.json.gz
        run: python3 -I orbita/tool/build_radio.py pages-repo/radio.json.gz

      - name: Commit & push
        working-directory: pages-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio.json.gz
          if git diff --cached --quiet -- radio.json.gz; then
            echo "radio.json.gz unchanged - nothing to publish."
          else
            git commit -m "Update radio.json.gz ($(date -u +%FT%TZ))"
            for try in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "push race, retrying ($try)"
              sleep 10
            done
          fi
