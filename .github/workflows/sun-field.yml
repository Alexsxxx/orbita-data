# The Sun's coronal magnetic field lines: the newest hourly GONG synoptic
# magnetogram (NSO), extended by a potential field source surface model
# and traced, to
#   https://alexsxxx.github.io/orbita-data/sun-field.json.gz
# Generator: tool/build_sun_field.py in the private Orbita repo - read its
# docstring for the method and why it is not pfsspy (GPL).
#
# Every three hours: GONG updates its map hourly, but the field's large
# shape moves over a day, and the app shows nothing older than two days.
# A run is a few seconds of numpy after a ~240 KB download.
name: sun-field

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Orbita (generator lives here)
        uses: actions/checkout@v4
        with:
          repository: Alexsxxx/Orbita
          ssh-key: ${{ secrets.ORBITA_READ_KEY }}
          path: orbita
          sparse-checkout: tool

      - name: Checkout orbita-data (publish target)
        uses: actions/checkout@v4
        with:
          repository: Alexsxxx/orbita-data
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages-repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: python3 -m pip install --quiet 'numpy>=2,<3'

      # Exits non-zero without writing when GONG cannot be had or too few
      # lines trace, so nothing bad is ever published.
      - name: Build sun-field.json.gz
        run: python3 -I orbita/tool/build_sun_field.py pages-repo/sun-field.json.gz

      - name: Commit & push
        working-directory: pages-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sun-field.json.gz
          if git diff --cached --quiet -- sun-field.json.gz; then
            echo "sun-field.json.gz unchanged - nothing to publish."
          else
            git commit -m "Update sun-field.json.gz ($(date -u +%FT%TZ))"
            for try in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "push race, retrying ($try)"
              sleep 10
            done
          fi
